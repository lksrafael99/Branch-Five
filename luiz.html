<!--
==================================================
LUIZ — SUA PARTE COMEÇA AQUI
==================================================

ALTERE SOMENTE ESTAS 3 COISAS:

1. ESCOLHA SUA COR
Procure a linha do body com style="--page-color: ..."
e troque a cor. Exemplo: #EAF2FF.

2. ADICIONE SUA FOTO
Coloque sua foto dentro da pasta images/.
Exemplo: images/luiz.jpg
Depois altere:
src="images/profile-placeholder.svg"
para:
src="images/luiz.jpg"
Use exatamente o nome e a extensão do arquivo da sua foto.

3. EDITE SEU TEXTO
Altere somente o conteúdo dentro de:
<p class="profile-text">
Escreva seu texto em inglês.

Quando terminar, SALVE O ARQUIVO.
Depois faremos:
git add luiz.html images/luiz.jpg
git commit -m "Update Luiz profile"
git push -u origin luiz-page
Se sua foto tiver outro nome, ajuste o comando git add.

NÃO PRECISA ALTERAR style.css.
NÃO PRECISA ALTERAR script.js.
NÃO ALTERE A PÁGINA DOS OUTROS INTEGRANTES.

==================================================
LUIZ — SUA PARTE TERMINA AQUI
==================================================
-->
